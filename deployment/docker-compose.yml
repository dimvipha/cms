networks:
  clinic-net:
    external: true

volumes:
  clinic-vol:
  keycloak-clinic-db-vol:

services:

  clinic-db:
    image: postgres:17.10
    container_name: clinic-db
    ports:
      - "1200:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - clinic-vol:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d

    networks:
      - clinic-net


  keycloak-clinic-db:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-clinic-db
    command: start-dev
    ports:
      - "1201:8080"

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://clinic-db:5432/keycloak_clinic_db
      KC_DB_USERNAME: ${POSTGRES_USERNAME}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}

      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: ispn
      KC_LOG_LEVEL: INFO
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      JAVA_OPTS_APPEND: "-Xms512m -Xmx2048m"

    volumes:
      - keycloak-clinic-db-vol:/opt/keycloak/data
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/providers:/opt/keycloak/providers

    depends_on:
      - clinic-db

    networks:
      - clinic-net

    restart: unless-stopped


  # catches every email Keycloak sends (staff setup links, password resets);
  # read them at http://localhost:1202
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: mailpit
    ports:
      - "1202:8025"

    networks:
      - clinic-net

    restart: unless-stopped