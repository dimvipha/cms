spring.application.name=clinic-management-system
server.port=1300

spring.config.import=optional:classpath:.env[.properties]

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:cms_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:1200/cms_db}

# jpa configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:1201/realms/cms}
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:1201}
keycloak.realm=${KEYCLOAK_REALM:cms}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:private-app}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}


