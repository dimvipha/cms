spring.application.name=clinic-management-system
server.port=1300

spring.config.import=optional:classpath:.env[.properties]

# clinic identity printed on prescriptions; time zone used for local dates
cms.clinic.name=${CLINIC_NAME:CMS Clinic}
cms.clinic.address=${CLINIC_ADDRESS:}
cms.clinic.phone=${CLINIC_PHONE:}
cms.clinic.time-zone=${CLINIC_TIME_ZONE:Asia/Bangkok}

# billing: currency printed on receipts; fee charged on every invoice generated from a visit
cms.billing.currency=${BILLING_CURRENCY:THB}
cms.billing.consultation-fee=${CONSULTATION_FEE:250.00}

# web frontend: browsers on these origins may call the API; invite and reset emails
# send people back to the login page, which must be a redirect URI of the Keycloak client
cms.frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
cms.frontend.login-url=${FRONTEND_LOGIN_URL:http://localhost:5173/login}
cms.frontend.client-id=${FRONTEND_CLIENT_ID:cms-app}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:clinic_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:1200/clinic_db}

# jpa configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:1201/realms/clinic}
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:1201}
keycloak.realm=${KEYCLOAK_REALM:clinic}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:private-app}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}


