# Flyway's migrations build the schema; Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# the password grant is ruled out by current OAuth guidance (RFC 9700); everyone signs in on Keycloak's page
cms.auth.password-endpoints=false
# no public API documentation (Swagger UI, /v3/api-docs) on the live server
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
