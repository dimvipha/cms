# Flyway's migrations build the schema; Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# the web app's own sign-in and sign-up forms use the password endpoints, so they stay on
cms.auth.password-endpoints=true
# no public API documentation (Swagger UI, /v3/api-docs) on the live server
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
